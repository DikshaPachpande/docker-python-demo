version: 0.2

phases:
  install:
    commands:
      - echo Installing phase started
      - docker --version

  pre_build:
    commands:
      - echo Pre-build phase

  build:
    commands:
      - echo Building Docker image
      - docker build -t myapp .

  post_build:
    commands:
      - echo Running container
      - docker run -d myapp
